version: '3.8'

services:
  chromadb-service:
    build:
      context: ./chromadb-service
      dockerfile: Dockerfile
    container_name: gcet-chromadb
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/app/chroma_data
    environment:
      - CHROMADB_PORT=8001
      - CHROMADB_COLLECTION=college_knowledge
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gcet-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - FRONTEND_URL=http://localhost:5173
      - CHROMADB_HOST=chromadb-service
      - CHROMADB_PORT=8001
      - CHROMADB_COLLECTION=college_knowledge
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - TOP_K=5
      - MAX_RETRY_ATTEMPTS=2
      - RELEVANCE_THRESHOLD=0.6
    depends_on:
      - chromadb-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=https://ragchatbot-6ib2.onrender.com
    container_name: gcet-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
